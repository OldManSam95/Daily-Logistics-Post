name: Live Foxlogi Logistics

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foxlogi-live-logistics
  cancel-in-progress: true

jobs:
  update-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update live Foxlogi Discord message
        env:
          FOXLOGI_API_KEY: ${{ secrets.FOXLOGI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_LOGI_POST }}
        run: python foxlogi_discord.py

      - name: Save Discord message IDs
        run: |
          if [ ! -f foxlogi-message-state.json ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foxlogi-message-state.json

          if git diff --cached --quiet; then
            echo "No message state change to commit"
          else
            git commit -m "Update Foxlogi Discord message state"
            git push
          fi
