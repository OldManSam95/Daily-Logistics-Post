name: Daily Logi Post

on:
  schedule:
    - cron: "45 10 * * *"
      timezone: "Europe/London"

  # Allows you to test it manually
  workflow_dispatch:

jobs:
  discord-post:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.Daily_Logi_Post }}
          MESSAGE: |
            📢 **Daily Regiment Update**

            Remember to check today's operations and announcements.

            See you on the front!
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["DISCORD_WEBHOOK_URL"]
          message = os.environ["MESSAGE"]

          data = json.dumps({
              "content": message
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"}
          )

          urllib.request.urlopen(request)
          PY
