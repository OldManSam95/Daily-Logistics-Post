name: Daily Discord Logistics Sitrep

on:
  schedule:
    - cron: "30 17 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

jobs:
  discord-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_LOGI_POST }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("sitrep-message.txt", "r", encoding="utf-8") as f:
              message = f.read().strip()

          if not message:
              raise RuntimeError("sitrep-message.txt is empty")

          data = json.dumps({"content": message}).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordWebhook-GitHubActions/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord Sitrep sent successfully")
                  print("Status:", response.status)
          except urllib.error.HTTPError as e:
              print("Discord returned HTTP error:", e.code)
              print(e.read().decode())
              raise
          PY
