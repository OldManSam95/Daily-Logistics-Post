name: Daily Discord Post

on:
  schedule:
    - cron: "0 19 * * *"
      timezone: "Europe/London"

  # Allows you to test it manually
  workflow_dispatch:

jobs:
  discord-post:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.Daily_Logi_Post }}
          MESSAGE: |
            📢 **Daily Regiment Update**

            Remember to check today's operations and announcements.

            See you on the front!
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = os.environ["DISCORD_WEBHOOK_URL"]
          message = os.environ["MESSAGE"]

          data = json.dumps({
              "content": message
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordWebhook-GitHubActions/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord message sent successfully!")
                  print("Status:", response.status)

          except urllib.error.HTTPError as e:
              print("Discord returned HTTP error:", e.code)
              print(e.read().decode())
              raise
          PY
