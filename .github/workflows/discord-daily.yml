name: Daily Discord Logistics Sitrep

on:
  schedule:
    - cron: "10 19 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

jobs:
  discord-post:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_LOGI_POST }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, date
          from zoneinfo import ZoneInfo

          # Day 1 = 25 August 2026
          start_date = date(2026, 8, 25)
          today = datetime.now(ZoneInfo("Europe/London")).date()
          day_number = (today - start_date).days + 1

          message = f"""# Daily Logistics Sitrep - Day {day_number}

          **Sitrep Note:** I have changed it so we only have 1 stockpile in Buckler Sound as there is a quick pull that I have added to the Stockpile codes.

          **Transport Priority:** Fill the **regiment stockpile first**, then the **quick pull**, with any remaining supplies going into **public**.

          This is to make sure supplies are actually moved out of Buckler Sound towards **Fading Lights and the front**, rather than building up in the backline.

          ## __**MPF TO DO LIST**__
          **Locations:** Speaking Woods, Tine

          **Small Arms:** Loughcaster, Sampo, Fiddler, Green Ash Grenade, 7.62mm, 9mm

          **Heavy Arms:** Mortar Shell, RPG, Cutler

          **Heavy Ammunition:** 30mm, 40mm

          **Resource:** Maintenance Supplies

          *Post Your MPF Queues Here: https://discord.com/channels/1186822663897878588/1361080809754202142*

          ## __**FACTORY TO DO LIST**__
          **Locations:** Speaking Woods, Tine

          **Small Arms:** Loughcaster, Sampo, Fiddler, Green Ash Grenade, 7.62mm, 9mm

          **Heavy Arms:** Mortar Shell, RPG, Cutler

          **Heavy Ammunition:** 30mm, 40mm

          **Utility:** Gas Mask, Gas Mask Filter, Radio, Binoculars, Alligator Charges

          **Medical:** Bandages, Plasma, First Aid Kit, Trauma Kit, Soldier Supplies (Shirts)

          ## __**REFINERY TO DO LIST**__
          **Tine / Speaking Woods**
          **Refined Material:** Basic Materials, Explosive Materials, Refined Materials

          **Fading Lights / Stonecradle**
          **Refined Material:** Basic Materials, HEP

          ## __**LOGISTICS REMINDER**__
          **1. Regiment Stockpile → 2. Quick Pull → 3. Public**

          Keep supplies moving south — **production sitting in Buckler Sound isn't helping the front.**
          """

          message = "\n".join(line.strip() for line in message.splitlines())

          url = os.environ["DISCORD_WEBHOOK_URL"]
          data = json.dumps({"content": message}).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordWebhook-GitHubActions/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord Sitrep sent successfully - Day {day_number}")
                  print("Status:", response.status)
          except urllib.error.HTTPError as e:
              print("Discord returned HTTP error:", e.code)
              print(e.read().decode())
              raise
          PY
