name: Daily Discord Logistics Sitrep

on:
  schedule:
    - cron: "10 19 * * *"
      timezone: "Europe/London"

  workflow_dispatch:

jobs:
  discord-post:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_LOGI_POST }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, date
          from zoneinfo import ZoneInfo

          # -------------------------------------------------
          # WAR DAY CALCULATION
          # -------------------------------------------------

          # Day 1 = 25 August 2026
          start_date = date(2026, 8, 25)

          # Get today's date in UK time
          today = datetime.now(ZoneInfo("Europe/London")).date()

          # Calculate current war day
          day_number = (today - start_date).days + 1

          # -------------------------------------------------
          # DISCORD MESSAGE
          # -------------------------------------------------

          message = f"""# Daily Logistics Sitrep - Day {day_number}

          Sitrep Note: I have changed it so we only have 1 stockpile in Buckler Sound as there is a quick pull that I have added to the Stockpile codes.

          When doing transport, the target should be to fill up our stockpile first, then the quick pull, with any remaining going into public. Otherwise we will have a lot of stuff sitting in Buckler and not getting moved down to Fading Lights and the front.

          ## __**MPF TO DO LIST**__
          Locations: Speaking Woods, Tine
          - Loughcaster, Sampo, Fiddler, Green Ash Grenade
          - Mortar Shell, RPGs, Cutlers
          - 30mm, 40mm
          - Maintenance Supplies
            - Note: *Post Your MPF Queues Here: https://discord.com/channels/1186822663897878588/1361080809754202142*

          ## __**FACTORY TO DO LIST**__
          Locations: Speaking Woods, Tine
          - 7.62mm, 9mm
          - Mortar Shell, RPGs
          - Gas Mask, Gas Mask Filter, Radio, Binoculars, Alligator Charges
          - Bandages, Plasma, First Aid Kit, Trauma Kit, Soldiers Supplies (Shirts)

          ## __**REFINERY TO DO LIST**__
          Locations: Tine, Speaking Woods
          - Basic Materials
          - Explosive Materials
          - Refined Materials

          Locations: Fading Lights, Stonecradle
          - Basic Materials
          - HEP
          """

          # Remove indentation introduced by the Python block
          message = "\n".join(line.strip() for line in message.splitlines())

          # -------------------------------------------------
          # SEND TO DISCORD
          # -------------------------------------------------

          url = os.environ["DISCORD_WEBHOOK_URL"]

          data = json.dumps({
              "content": message
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordWebhook-GitHubActions/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord Sitrep sent successfully - Day {day_number}")
                  print("Status:", response.status)

          except urllib.error.HTTPError as e:
              print("Discord returned HTTP error:", e.code)
              print(e.read().decode())
              raise
          PY
